# docker-compose.yml — orchestrate toàn bộ hạ tầng cho môi trường DEV/local.
# Mỗi "service" dưới đây = 1 container. "networks" = mạng ảo riêng 

networks:
  cyms-net:
    driver: bridge

volumes:
  postgres-data:

services:
  # ---------------------------------------------------------------
  # PostgreSQL — 1 instance, schema "management"
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Volume đặt tên (named volume) — dữ liệu sống ngoài vòng đời container,
      # xóa/tạo lại container không mất data; chỉ mất khi xóa volume tường minh.
      - postgres-data:/var/lib/postgresql/data
      # Script trong db/init chỉ chạy 1 LẦN lúc volume còn trống (tạo 2 schema).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cyms-net]

  # ---------------------------------------------------------------
  # Redis — cache danh mục/báo cáo truy vấn nhiều
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cyms-net]

  # ---------------------------------------------------------------
  # Management Service — CRUD nghiệp vụ chính
  # ---------------------------------------------------------------
  management-service:
    build:
      context: ./app/backend/Management
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${MANAGEMENT_DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
    ports:
      - "${MANAGEMENT_SERVICE_PORT}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    networks: [cyms-net]
